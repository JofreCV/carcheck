<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Registra que has cerrado el coche y dónde lo has aparcado.">
  <title>CarCheck</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>🚗 CarCheck</h1>
  </header>

  <main>
    <!-- Inicio: estado actual + botón principal (abajo, al alcance del pulgar) -->
    <section id="view-home" class="view" aria-label="Inicio">
      <article id="status-card" class="card status-card" aria-live="polite">
        <p class="status-title">Sin registro</p>
      </article>
      <button id="btn-lock" class="btn-lock" type="button">🔒 Coche cerrado</button>
    </section>

    <!-- ¿Dónde está mi coche? -->
    <section id="view-map" class="view view-map" aria-label="Mapa" hidden>
      <div id="map" class="map"></div>
      <div class="card map-panel">
        <p id="map-info" class="map-info">Cargando mapa…</p>
        <div class="map-actions">
          <button type="button" id="btn-center" class="btn">🎯 Centrar</button>
          <a id="btn-directions" class="btn primary" target="_blank" rel="noopener" hidden>🚶 Cómo llegar</a>
        </div>
      </div>
    </section>

    <!-- Historial -->
    <section id="view-history" class="view" aria-label="Historial" hidden>
      <h2 class="section-title">Historial</h2>
      <ul id="history-list" class="history-list"></ul>

      <section class="card storage-card" aria-labelledby="storage-title">
        <h2 id="storage-title" class="section-title">Almacenamiento</h2>
        <p id="storage-usage">Calculando…</p>
        <p id="storage-persist"></p>
        <button type="button" id="btn-persist" class="btn block" hidden>🛡️ Pedir que no se borren los datos</button>
        <label class="field retention-field">
          <span>Conservar fotos y vídeos de los últimos</span>
          <span class="retention-row">
            <input id="retention-input" type="number" min="1" max="100" step="1" inputmode="numeric" required>
            <span>registros</span>
          </span>
        </label>
        <p class="muted small">De los registros más antiguos se borra el archivo, pero se conservan la hora,
          la ubicación, la nota y la miniatura.</p>
      </section>
    </section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-view="home" aria-current="page"><span aria-hidden="true">🏠</span>Inicio</button>
    <button type="button" data-view="map"><span aria-hidden="true">🗺️</span>Mapa</button>
    <button type="button" data-view="history"><span aria-hidden="true">🕑</span>Historial</button>
  </nav>

  <!-- Hoja de cierre: se abre al pulsar el botón y el GPS empieza a buscar en ese momento -->
  <dialog id="lock-sheet" class="sheet" aria-labelledby="lock-sheet-title">
    <form id="lock-form" method="dialog">
      <h2 id="lock-sheet-title">Registrar cierre</h2>

      <div id="gps-status" class="gps-status" role="status" aria-live="polite"></div>

      <div class="field">
        <span>Prueba visual <span class="muted">(opcional)</span></span>
        <div id="proof-buttons" class="proof-buttons">
          <button type="button" id="btn-photo" class="btn">📷 Foto</button>
          <button type="button" id="btn-video" class="btn">🎥 Vídeo</button>
        </div>
        <div id="proof-preview" class="proof-preview" hidden>
          <img id="proof-thumb" alt="Miniatura de la prueba">
          <span id="proof-info"></span>
          <button type="button" id="btn-proof-remove" class="btn">✕ Quitar</button>
        </div>
        <!-- En Android, capture="environment" abre directamente la cámara trasera -->
        <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
        <!-- Fallback si no se puede grabar dentro de la app (sin MediaRecorder o sin permiso) -->
        <input type="file" id="video-input" accept="video/*" capture="environment" hidden>
      </div>

      <label class="field">
        <span>Nota <span class="muted">(opcional)</span></span>
        <input id="note-input" type="text" maxlength="120" autocomplete="off"
               placeholder="Planta -2, plaza 47, calle…" enterkeyhint="done">
      </label>

      <div class="sheet-actions">
        <button type="button" id="btn-sheet-cancel" class="btn">Cancelar</button>
        <button type="submit" id="btn-save" class="btn primary">Guardar</button>
      </div>
      <button type="button" id="btn-save-now" class="btn block" hidden>Guardar sin esperar al GPS</button>
    </form>
  </dialog>

  <!-- Grabador de vídeo: vista previa de la cámara trasera, cuenta atrás de 5 s -->
  <dialog id="recorder" class="fullscreen recorder" aria-label="Grabar vídeo">
    <video id="recorder-preview" autoplay muted playsinline></video>
    <div id="recorder-countdown" class="recorder-countdown" hidden></div>
    <p id="recorder-hint" class="recorder-hint"></p>
    <div class="recorder-actions">
      <button type="button" id="btn-rec-cancel" class="btn">Cancelar</button>
      <button type="button" id="btn-rec-toggle" class="btn rec-button"></button>
    </div>
  </dialog>

  <!-- Visor a pantalla completa de la foto o el vídeo -->
  <dialog id="viewer" class="fullscreen" aria-label="Prueba visual">
    <button type="button" id="btn-viewer-close" class="viewer-close" aria-label="Cerrar">✕</button>
    <div id="viewer-content" class="viewer-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
